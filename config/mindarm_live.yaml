# Used by tools/eeg_view.py: a voluntary double blink captured by electrodes (eye movement, not
# brain activity) selects the sponge on the real arm. Read risk 10 in docs/SPEC.md first.
eeg: stream
decoder: blink
perception: fake
planner: nemotron
arm: jetson

# Relative paths resolve from this file's parent directory.
scene_path: ../fixtures/scene_sponge.json
joint_limits_path: joint_limits.yaml
jetson_arm_path: jetson_arm.yaml
replay_path: ../recordings/example.npz
logs_dir: ../logs
recordings_dir: ../recordings

sample_rate: 250.0
n_channels: 1
frequency: 12.0
noise_std: 0.2
alpha_bursts: false
seed: 7
replay_loop: true
record_eeg: true
eeg_chunk_samples: 25
poll_interval: 0.02
stream_url: http://127.0.0.1:8765/stream
target_label: sponge
blink_threshold_mv: 250.0
blink_min_gap_s: 0.1
blink_max_gap_s: 0.8
blink_refractory_s: 1.5
planner_timeout: 30.0
planner_max_tokens: 4096
# Per-operation call options; measurements behind them are in docs/SPEC.md.
planner_propose:
  reasoning: false
  strict_schema: true
planner_plan:
  reasoning: false
  strict_schema: true

# arm: jetson starts the arm service over SSH stdio (no port forwarding). Windows' OpenSSH is
# named explicitly: the Git ssh found first on PATH fails over the Jetson's USB network link.
jetson_command:
  - C:/Windows/System32/OpenSSH/ssh.exe
  - -T
  - -o
  - BatchMode=yes
  - -o
  - ServerAliveInterval=2
  - -o
  - ServerAliveCountMax=3
  - jetson-usb
  - python3 -u ~/mindarm_arm.py
